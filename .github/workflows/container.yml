name: Build container images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  v1-gates:
    name: Run v1 gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mkdocs and jq
        run: pip install mkdocs mkdocs-material && sudo apt-get update && sudo apt-get install -y jq

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Run format check
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run cargo deny
        run: cargo deny check

      - name: Run web typecheck
        working-directory: apps/web
        run: CI=true pnpm run typecheck

      - name: Run web lint
        working-directory: apps/web
        run: CI=true pnpm run lint

      - name: Run web build
        working-directory: apps/web
        run: CI=true pnpm run build

      - name: Run docs build
        run: mkdocs build --config-file docs/mkdocs.yml --strict --clean

      - name: Run Caddy security checks
        run: ./scripts/check-caddy-security.sh

      - name: Run release compose config check
        run: IPTV_VERSION=latest docker compose -f docker-compose.appliance.yml --env-file .env.appliance.example config --quiet

      - name: Run release compose regression tests
        run: ./scripts/test-release-compose.sh

  # Build core and gateway images per-platform in parallel.
  # Each platform pushes a tagged image with a -amd64 or -arm64 suffix.
  # The manifest job merges these into a single multi-arch image.
  build-image:
    name: Build ${{ matrix.target }} (${{ matrix.platform }})
    needs: v1-gates
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: [core, gateway]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
            arch: linux/amd64
            suffix: -amd64
          - platform: arm64
            runner: ubuntu-24.04-arm
            arch: linux/arm64
            suffix: -arm64
          - target: core
            context: .
            file: ./Dockerfile
            image_suffix: ''
          - target: gateway
            context: .
            file: ./Dockerfile.gateway
            image_suffix: -gateway
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        id: prefix
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prefix.outputs.prefix }}${{ matrix.image_suffix }}
          tags: |
            type=ref,event=tag
          flavor: |
            suffix=${{ matrix.suffix }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,ref=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,ref=${{ matrix.target }}-${{ matrix.platform }},mode=max

      - name: Export digest
        id: digest
        run: echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # Build web assets natively on the runner, then build the prebuilt image
  # per-platform. The .output directory is platform-independent JavaScript.
  build-web:
    name: Build web (${{ matrix.platform }})
    needs: v1-gates
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
            arch: linux/amd64
            suffix: -amd64
          - platform: arm64
            runner: ubuntu-24.04-arm
            arch: linux/arm64
            suffix: -arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        id: prefix
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Build web assets
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          CI=true pnpm run build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prefix.outputs.prefix }}-web
          tags: |
            type=ref,event=tag
          flavor: |
            suffix=${{ matrix.suffix }}

      - name: Build and push web image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile.prebuilt
          platforms: ${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,ref=web-${{ matrix.platform }}
          cache-to: type=gha,ref=web-${{ matrix.platform }},mode=max

  # Merge per-platform images into multi-arch manifests, tag with latest
  # for stable releases, and sign with Cosign.
  manifest:
    name: Merge and sign manifests
    needs: [build-image, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        id: prefix
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Create multi-arch manifests and sign
        env:
          IMAGE_PREFIX: ${{ steps.prefix.outputs.prefix }}
          IS_STABLE: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The per-platform images are tagged with the git ref (e.g. v0.1.4)
          # plus a -amd64 or -arm64 suffix from the metadata flavor.
          # We merge these into multi-arch manifests with clean tags.

          # Extract semver components from the ref tag (v0.1.4 -> 0.1.4)
          VERSION="${REF_TAG#v}"
          MAJOR_MINOR="$(echo ${VERSION} | cut -d. -f1-2)"
          MAJOR="$(echo ${VERSION} | cut -d. -f1)"

          # Tags to create on the multi-arch manifest
          TAGS=("${REF_TAG}" "${VERSION}" "${MAJOR_MINOR}" "${MAJOR}")

          if [ "${IS_STABLE}" = "true" ]; then
            TAGS+=("latest")
          fi

          IMAGES=("${IMAGE_PREFIX}" "${IMAGE_PREFIX}-web" "${IMAGE_PREFIX}-gateway")

          for image in "${IMAGES[@]}"; do
            echo "Creating multi-arch manifest for ${image}"

            for tag in "${TAGS[@]}"; do
              echo "  Merging ${tag} from ${REF_TAG}-amd64 and ${REF_TAG}-arm64"
              docker buildx imagetools create \
                -t "${image}:${tag}" \
                "${image}:${REF_TAG}-amd64" \
                "${image}:${REF_TAG}-arm64"
            done

            # Get the digest of the multi-arch manifest
            DIGEST=$(docker buildx imagetools inspect "${image}:${REF_TAG}" --format '{{.Manifest.Digest}}')

            echo "Signing ${image}@${DIGEST}"
            cosign sign --yes "${image}@${DIGEST}"

            echo "Verifying ${image}@${DIGEST}"
            cosign verify \
              --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/container.yml@${{ github.ref }}" \
              --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
              "${image}@${DIGEST}"
          done
