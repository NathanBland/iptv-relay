name: Build container images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  v1-gates:
    name: Run v1 gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mkdocs and jq
        run: pip install mkdocs mkdocs-material && sudo apt-get update && sudo apt-get install -y jq

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Run format check
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run cargo deny
        run: cargo deny check

      - name: Run web typecheck
        working-directory: apps/web
        run: CI=true pnpm run typecheck

      - name: Run web lint
        working-directory: apps/web
        run: CI=true pnpm run lint

      - name: Run web build
        working-directory: apps/web
        run: CI=true pnpm run build

      - name: Run docs build
        run: mkdocs build --config-file docs/mkdocs.yml --strict --clean

      - name: Run Caddy security checks
        run: ./scripts/check-caddy-security.sh

      - name: Run release compose config check
        run: IPTV_VERSION=latest docker compose -f docker-compose.appliance.yml --env-file .env.appliance.example config --quiet

      - name: Run release compose regression tests
        run: ./scripts/test-release-compose.sh

  image:
    name: Build and sign ${{ matrix.target }} image
    needs: v1-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: core
            context: .
            file: ./Dockerfile
            suffix: ''
          - target: web
            context: ./apps/web
            file: ./apps/web/Dockerfile
            suffix: -web
          - target: gateway
            context: .
            file: ./Dockerfile.gateway
            suffix: -gateway
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}${{ matrix.suffix }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest
        env:
          IMAGE_NAME: ${{ env.IMAGE_PREFIX }}${{ matrix.suffix }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify image signature
        env:
          IMAGE_NAME: ${{ env.IMAGE_PREFIX }}${{ matrix.suffix }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/container.yml@${{ github.ref }}
        run: |
          cosign verify \
            --certificate-identity="${COSIGN_CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"
