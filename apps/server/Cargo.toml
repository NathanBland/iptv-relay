[package]
name = "iptv-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Builds the deterministic pinned-runner scale gate binary. Enables the
# `scale` fixture generators in `iptv-parsers`. The scale-gate runner activates
# snapshots against an optional test database, so the feature pulls in `sqlx`
# for the deterministic test-only owner setup and cleanup.
scale-gate = ["iptv-parsers/scale", "dep:sqlx"]

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
iptv-api = { path = "../../crates/api", version = "0.1.0" }
iptv-domain = { path = "../../crates/domain", version = "0.1.0" }
iptv-ingest = { path = "../../crates/ingest", version = "0.1.0" }
iptv-media = { path = "../../crates/media", version = "0.1.0" }
iptv-parsers = { path = "../../crates/parsers", version = "0.1.0" }
iptv-persistence = { path = "../../crates/persistence", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["json"] }
sqlx = { workspace = true, optional = true }
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
sqlx.workspace = true

[[bin]]
name = "scale-gate"
path = "src/bin/scale-gate.rs"
required-features = ["scale-gate"]

[lints]
workspace = true
