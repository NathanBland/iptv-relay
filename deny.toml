[advisories]
# The chrono maintainers stopped maintenance. The advisories report no
# vulnerability. Remove these entries when the chrono migration is complete.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, with no known vulnerability; a migration to jiff is planned" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained, with no known vulnerability; a migration to jiff is planned" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
