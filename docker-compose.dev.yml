name: iptv-gateway-dev

# Use this file with docker-compose.yml.
# Run `make compose-dev-build` before `make compose-dev-up`.
services:
  core:
    image: iptv-gateway-core:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    entrypoint: []
    volumes:
      - ./:/build:cached
      - cargo-target:/build/target
    command: ["/usr/local/bin/dev-reload.sh", "/build/Cargo.toml:/build/Cargo.lock:/build/crates:/build/apps/server/src:/build/migrations", "serve"]
    environment:
      RUST_LOG: ${RUST_LOG:-info,iptv=debug}
      IPTV_DEV_CARGO_JOBS: ${IPTV_DEV_CARGO_JOBS:-2}
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      # Enable the local-only control API bypass when both flags are true.
      IPTV_DEV_MODE: ${IPTV_DEV_MODE:-false}
      IPTV_DEV_AUTH_DISABLED: ${IPTV_DEV_AUTH_DISABLED:-false}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8081/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  worker:
    image: iptv-gateway-core:dev
    entrypoint: []
    volumes:
      - ./:/build:cached
      - cargo-target:/build/target
    command: ["/usr/local/bin/dev-run-binary.sh", "/build/target/release/iptv-gateway", "worker"]
    deploy:
      replicas: ${IPTV_DEV_WORKER_COUNT:-1}
    environment:
      RUST_LOG: ${RUST_LOG:-info,iptv=debug}
      IPTV_CORE_INTERNAL_URL: http://core:8081
      IPTV_ADMIN_BOOTSTRAP_TOKEN: ${IPTV_ADMIN_BOOTSTRAP_TOKEN:?Set IPTV_ADMIN_BOOTSTRAP_TOKEN}
    depends_on:
      core:
        condition: service_healthy
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/iptv-worker-active"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 5s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/web:/app:cached
      - web-node-modules:/app/node_modules
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  cargo-target:
  web-node-modules:
