name: iptv-gateway

services:
  gateway:
    image: caddy:2.10-alpine
    depends_on:
      core:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${IPTV_GATEWAY_BIND:-127.0.0.1}:${IPTV_GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      CORE_INTERNAL_URL: http://core:8081
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  core:
    image: iptv-gateway-core:local
    build:
      context: .
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://iptv:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/iptv
      IPTV_BIND: 0.0.0.0:8081
      IPTV_PUBLIC_BASE_URL: ${IPTV_PUBLIC_BASE_URL:-http://localhost:8080}
      IPTV_OUTPUT_TOKEN: ${IPTV_OUTPUT_TOKEN:?Set IPTV_OUTPUT_TOKEN}
      IPTV_ADMIN_BOOTSTRAP_TOKEN: ${IPTV_ADMIN_BOOTSTRAP_TOKEN:?Set IPTV_ADMIN_BOOTSTRAP_TOKEN}
      IPTV_ADMIN_PASSWORD: ${IPTV_ADMIN_PASSWORD:-}
      IPTV_ADMIN_PASSWORD_HASH: ${IPTV_ADMIN_PASSWORD_HASH:-}
      IPTV_MASTER_KEY: ${IPTV_MASTER_KEY:?Set IPTV_MASTER_KEY}
      IPTV_TUNER_COUNT: ${IPTV_TUNER_COUNT:-1}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8081/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    image: iptv-gateway-core:local
    command: ["worker"]
    deploy:
      replicas: ${IPTV_WORKER_COUNT:-4}
    environment:
      DATABASE_URL: postgres://iptv:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/iptv
      IPTV_MASTER_KEY: ${IPTV_MASTER_KEY:?Set IPTV_MASTER_KEY}
      IPTV_CORE_INTERNAL_URL: http://core:8081
      IPTV_ADMIN_BOOTSTRAP_TOKEN: ${IPTV_ADMIN_BOOTSTRAP_TOKEN:?Set IPTV_ADMIN_BOOTSTRAP_TOKEN}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_healthy
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -U iptv -d iptv || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${IPTV_POSTGRES_PORT:-54329}:5432"
    environment:
      POSTGRES_DB: iptv
      POSTGRES_USER: iptv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iptv -d iptv"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  fake-provider:
    image: iptv-gateway-core:local
    entrypoint: ["test-provider"]
    profiles: ["test"]
    environment:
      FAKE_PROVIDER_BIND: 0.0.0.0:8090
      FAKE_PROVIDER_BASE_URL: http://fake-provider:8090
      FAKE_PROVIDER_MAX_CONNECTIONS: ${LIVE_ACCEPTANCE_PROVIDER_CAP:-3}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["test"]
    expose:
      - "8474"
      - "8666-8668"

  media-acceptance:
    image: iptv-gateway-core:local
    entrypoint: ["media-acceptance"]
    profiles: ["test"]
    environment:
      FAKE_PROVIDER_URL: http://fake-provider:8090
      MEDIA_ACCEPTANCE_SECONDS: ${MEDIA_ACCEPTANCE_SECONDS:-120}
    depends_on:
      fake-provider:
        condition: service_healthy
    restart: "no"

  fault-acceptance:
    image: iptv-gateway-core:local
    entrypoint: ["fault-acceptance"]
    profiles: ["test"]
    environment:
      FAKE_PROVIDER_URL: http://fake-provider:8090
      TOXIPROXY_URL: http://toxiproxy:8474
      TOXIPROXY_PROXY_PORT: "8666"
      FAULT_ACCEPTANCE_SECONDS: ${FAULT_ACCEPTANCE_SECONDS:-60}
    depends_on:
      fake-provider:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    restart: "no"

  live-acceptance:
    image: iptv-gateway-core:local
    entrypoint: ["live-acceptance"]
    profiles: ["test"]
    environment:
      IPTV_TEST_M3U_URL: ${IPTV_TEST_M3U_URL}
      LIVE_ACCEPTANCE_SECONDS: ${LIVE_ACCEPTANCE_SECONDS:-30}
    restart: "no"

  live-acceptance-gateway:
    image: iptv-gateway-core:local
    entrypoint: ["live-acceptance"]
    profiles: ["test"]
    environment:
      IPTV_GATEWAY_URL: http://gateway:8080
      IPTV_OUTPUT_TOKEN: ${IPTV_OUTPUT_TOKEN}
      IPTV_ADMIN_BOOTSTRAP_TOKEN: ${IPTV_ADMIN_BOOTSTRAP_TOKEN}
      IPTV_TEST_PROVIDER_URL: http://fake-provider:8090
      LIVE_ACCEPTANCE_SECONDS: ${LIVE_ACCEPTANCE_SECONDS:-120}
      LIVE_ACCEPTANCE_CHANNELS: ${LIVE_ACCEPTANCE_CHANNELS:-3}
      LIVE_ACCEPTANCE_PROVIDER_CAP: ${LIVE_ACCEPTANCE_PROVIDER_CAP:-3}
      LIVE_ACCEPTANCE_SOAK: ${LIVE_ACCEPTANCE_SOAK:-0}
      LIVE_ACCEPTANCE_SOAK_SECONDS: ${LIVE_ACCEPTANCE_SOAK_SECONDS:-1800}
    depends_on:
      gateway:
        condition: service_started
      core:
        condition: service_healthy
      fake-provider:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: "no"

  jellyfin-acceptance:
    image: iptv-gateway-core:local
    entrypoint: ["jellyfin-acceptance"]
    profiles: ["test"]
    environment:
      IPTV_GATEWAY_URL: http://gateway:8080
      IPTV_OUTPUT_TOKEN: ${IPTV_OUTPUT_TOKEN}
      IPTV_ADMIN_BOOTSTRAP_TOKEN: ${IPTV_ADMIN_BOOTSTRAP_TOKEN}
      IPTV_TEST_PROVIDER_URL: http://fake-provider:8090
      IPTV_TUNER_COUNT: ${IPTV_TUNER_COUNT:-3}
      JELLYFIN_ACCEPTANCE_CHANNELS: ${JELLYFIN_ACCEPTANCE_CHANNELS:-3}
      JELLYFIN_ACCEPTANCE_SECONDS: ${JELLYFIN_ACCEPTANCE_SECONDS:-5}
      JELLYFIN_ACCEPTANCE_SSDP: "0"
    depends_on:
      gateway:
        condition: service_started
      core:
        condition: service_healthy
      fake-provider:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: "no"

  scale-gate:
    image: iptv-gateway-core:local
    entrypoint: ["scale-gate"]
    profiles: ["test"]
    environment:
      IPTV_TEST_DATABASE_URL: postgres://iptv:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/iptv
      SCALE_GATE_LABEL: pinned-runner
      SCALE_GATE_BASELINE: /app/tests/fixtures/scale-gate-baseline.json
      SCALE_GATE_RESULTS: /tmp/scale-gate-results.json
      SCALE_GATE_ENTRIES: ${SCALE_GATE_ENTRIES:-1160000}
      SCALE_GATE_CHANNELS: ${SCALE_GATE_CHANNELS:-2750}
      SCALE_GATE_PROGRAMMES: ${SCALE_GATE_PROGRAMMES:-275000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./target/scale-gate:/tmp
    restart: "no"

volumes:
  postgres-data:
