[package]
name = "iptv-gateway-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
iptv-parsers = { path = "../crates/parsers" }

[workspace]
members = ["."]

[[bin]]
name = "m3u"
path = "fuzz_targets/m3u.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xmltv"
path = "fuzz_targets/xmltv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xtream"
path = "fuzz_targets/xtream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "events"
path = "fuzz_targets/events.rs"
test = false
doc = false
bench = false
